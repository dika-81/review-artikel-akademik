# Bangun dan terbitkan versi web (folder web/) ke GitHub Pages.
# Mesin Python dibangun ulang dari app.py dan modul inti setiap kali main berubah.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        # psycopg hanya untuk test impor mode production (PostgreSQL) di tests/test_app.py.
        run: pip install -r requirements.txt pytest "psycopg[binary]>=3.2,<4"

      - name: Jalankan test
        run: python -m pytest tests -q

      - name: Bangun paket web
        run: python tools/build_web.py

      - name: Siapkan isi situs
        run: |
          mkdir _site
          cp -r web/index.html web/app.css web/js web/py web/static _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
