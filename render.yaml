services:
  - type: web
    name: revisi-artikel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: SESSION_TYPE
        value: filesystem
      - key: SESSION_LIFETIME_MINUTES
        value: "120"
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_TIMEOUT_SECONDS
        value: "300"
      # Aktifkan Redis untuk session production yang tahan restart/multi-instance:
      # ubah SESSION_TYPE menjadi "redis" dan isi REDIS_URL dari Render Key Value
      # (atau layanan Redis eksternal seperti Upstash).
      # - key: REDIS_URL
      #   sync: false
