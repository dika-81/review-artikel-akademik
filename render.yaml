services:
  - type: web
    name: revisi-artikel
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && flask --app app init-db
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 360 app:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: API_KEY_ENCRYPTION_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: SESSION_TYPE
        value: sqlalchemy
      - key: SESSION_LIFETIME_MINUTES
        value: "120"
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_TIMEOUT_SECONDS
        value: "300"
